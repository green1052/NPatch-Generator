name: Build and Release

on:
    schedule:
        -   cron: "0 0 */3 * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   uses: actions/checkout@v7

            -   uses: pnpm/action-setup@v6

            -   uses: actions/setup-node@v7
                with:
                    node-version: latest
                    cache: pnpm

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 25

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Cache patchright chromium
                uses: actions/cache@v6
                with:
                    path: ~/.cache/ms-playwright
                    key: patchright-chromium

            -   name: Cache jars
                uses: actions/cache@v6
                with:
                    path: bin
                    key: jars-${{ hashFiles('package.json') }}

            -   name: Install patchright browser
                run: pnpm exec patchright install chromium

            -   name: Connect to NordVPN US
                env:
                    NORDVPN_SERVICE_USERNAME: ${{ secrets.NORDVPN_SERVICE_USERNAME }}
                    NORDVPN_SERVICE_PASSWORD: ${{ secrets.NORDVPN_SERVICE_PASSWORD }}
                run: |
                    set -euo pipefail

                    sudo apt-get update
                    sudo apt-get install -y openvpn unzip curl

                    sudo mkdir -p /etc/openvpn/nordvpn

                    curl -fL \
                        https://downloads.nordcdn.com/configs/archives/servers/ovpn.zip \
                        -o /tmp/nordvpn-ovpn.zip

                    rm -rf /tmp/nordvpn-configs
                    mkdir -p /tmp/nordvpn-configs

                    unzip -q \
                        /tmp/nordvpn-ovpn.zip \
                        -d /tmp/nordvpn-configs

                    CONFIG=$(find /tmp/nordvpn-configs \
                        -type f \
                        -name 'us*.nordvpn.com.udp.ovpn' \
                        | sort \
                        | head -n 1)

                    if [ -z "$CONFIG" ]; then
                        echo "ERROR: No US OpenVPN configuration found."
                        find /tmp/nordvpn-configs \
                            -type f \
                            -name '*.ovpn' \
                            | head -100
                        exit 1
                    fi

                    sudo cp \
                        "$CONFIG" \
                        /etc/openvpn/nordvpn/us.ovpn

                    sudo install -m 600 /dev/null \
                        /etc/openvpn/nordvpn/auth.txt

                    printf '%s\n%s\n' \
                        "$NORDVPN_SERVICE_USERNAME" \
                        "$NORDVPN_SERVICE_PASSWORD" \
                        | sudo tee /etc/openvpn/nordvpn/auth.txt > /dev/null

                    sudo openvpn \
                        --config /etc/openvpn/nordvpn/us.ovpn \
                        --auth-user-pass /etc/openvpn/nordvpn/auth.txt \
                        --auth-nocache \
                        --daemon \
                        --writepid /run/openvpn-nordvpn-us.pid \
                        --log /tmp/nordvpn.log

                    CONNECTED=false

                    for i in {1..60}; do
                        if sudo grep -q \
                            "Initialization Sequence Completed" \
                            /tmp/nordvpn.log; then
                            CONNECTED=true
                            break
                        fi

                        if sudo grep -qiE \
                            "AUTH_FAILED|AUTHENTICATION_FAILED|TLS Error|Connection failed" \
                            /tmp/nordvpn.log; then
                            sudo tail -100 /tmp/nordvpn.log
                            exit 1
                        fi

                        sleep 2
                    done

                    if [ "$CONNECTED" != "true" ]; then
                        sudo tail -100 /tmp/nordvpn.log
                        exit 1
                    fi

                    PUBLIC_IP=$(curl -4fsS --max-time 15 \
                        https://api.ipify.org)

                    VPN_COUNTRY=$(curl -4fsS --max-time 15 \
                        https://ipinfo.io/country)

                    VPN_COUNTRY=$(echo "$VPN_COUNTRY" | tr -d '[:space:]')

                    echo "Public IP: $PUBLIC_IP"
                    echo "VPN country: $VPN_COUNTRY"

                    if [ "$VPN_COUNTRY" != "US" ]; then
                        echo "ERROR: VPN is not connected to the United States."
                        exit 1
                    fi

            -   name: Build APKs
                env:
                    DISPLAY: :99
                run: |
                    set -e
                    Xvfb :99 -screen 0 1920x1080x24 &
                    pnpm start

            -   name: Disconnect NordVPN
                if: always()
                run: |
                    if [ -f /run/openvpn-nordvpn-us.pid ]; then
                        PID=$(sudo cat /run/openvpn-nordvpn-us.pid || true)

                        if [ -n "${PID:-}" ] && \
                           sudo kill -0 "$PID" 2>/dev/null; then
                            sudo kill "$PID" || true

                            for i in {1..15}; do
                                if ! sudo kill -0 "$PID" 2>/dev/null; then
                                    break
                                fi
                                sleep 1
                            done
                        fi

                        sudo rm -f /run/openvpn-nordvpn-us.pid
                    fi

                    sudo pkill openvpn || true
                    sudo rm -rf /etc/openvpn/nordvpn
                    rm -rf /tmp/nordvpn-configs
                    rm -f /tmp/nordvpn-ovpn.zip
                    rm -f /tmp/nordvpn.log

            -   name: Upload to Releases
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ github.run_id }}
                    name: NPatch Build ${{ github.run_id }}
                    files: build/*-npatched.apk
                    generate_release_notes: true

            -   name: Delete old releases
                uses: Nats-ji/delete-old-releases@v1
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    keep-count: 1
                    keep-old-minor-releases: false
                    remove-tags: true
