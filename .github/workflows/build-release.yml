name: Build and Release

on:
    schedule:
        -   cron: "0 0 */3 * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: build
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup pnpm
                uses: pnpm/action-setup@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: latest
                    cache: pnpm

            -   name: Setup JDK 25
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 25

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Cache camoufox browser
                uses: actions/cache@v6
                with:
                    path: ~/.cache/camoufox
                    key: camoufox-${{ hashFiles('pnpm-lock.yaml') }}

            -   name: Cache jars
                uses: actions/cache@v6
                with:
                    path: bin
                    key: jars-${{ hashFiles('package.json') }}

            -   name: Install camoufox browser
                run: pnpm exec camoufox-js fetch

            -   name: Install NordVPN
                shell: bash
                run: |
                    set -euo pipefail
                    curl -fsSL https://downloads.nordcdn.com/apps/linux/install.sh | sh
                    sudo groupadd -f nordvpn && sudo usermod -aG nordvpn "$USER"
                    sudo systemctl enable --now nordvpnd
                    for i in {1..15}; do
                        sudo systemctl is-active --quiet nordvpnd && break
                        sleep 2
                    done
                    sudo systemctl is-active --quiet nordvpnd

            -   name: Connect to NordVPN
                shell: bash
                env:
                    NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
                run: |
                    set -euo pipefail
                    sg nordvpn -c "nordvpn login --token \"$NORDVPN_TOKEN\""
                    sg nordvpn -c "nordvpn connect United_States"
                    for i in {1..15}; do
                        STATUS=$(sg nordvpn -c 'nordvpn status' || true)
                        echo "$STATUS"
                        grep -q "Connected" <<< "$STATUS" && exit 0
                        sleep 2
                    done
                    sudo journalctl -u nordvpnd --no-pager -n 50 || true
                    exit 1

            -   name: Build APKs
                run: pnpm start

            -   name: Disconnect NordVPN
                if: always()
                shell: bash
                run: |
                    set +e
                    sg nordvpn -c 'nordvpn disconnect'

            -   name: Upload to Releases
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ github.run_id }}
                    name: NPatch Build ${{ github.run_id }}
                    files: build/*-npatched.apk
                    generate_release_notes: true

            -   name: Delete old releases
                uses: Nats-ji/delete-old-releases@v1
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    keep-count: 1
                    keep-old-minor-releases: false
                    remove-tags: true
