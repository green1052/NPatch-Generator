name: Build and Release

on:
    schedule:
        -   cron: "0 0 */3 * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   uses: actions/checkout@v7

            -   uses: pnpm/action-setup@v6

            -   uses: actions/setup-node@v7
                with:
                    node-version: latest
                    cache: pnpm

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 25

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Cache patchright chromium
                uses: actions/cache@v4
                with:
                    path: ~/.cache/ms-playwright
                    key: patchright-chromium

            -   name: Cache jars
                uses: actions/cache@v6
                with:
                    path: bin
                    key: jars-${{ hashFiles('package.json') }}

            -   name: Install patchright browser
                run: pnpm exec patchright install chromium

            -   name: Install Android SDK build-tools
                run: |
                    ANDROID_HOME=$HOME/android-sdk
                    mkdir -p $ANDROID_HOME/cmdline-tools
                    wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
                    unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
                    mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
                    yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;36.0.0" 2>/dev/null
                    echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH

            -   name: Build APKs
                env:
                    DISPLAY: :99
                run: |
                    Xvfb :99 -screen 0 1920x1080x24 &
                    pnpm start
                    for f in build/*-npatched.apk; do
                        zipalign -f -p 4 "$f" "$f.aligned"
                        apksigner sign --ks bin/debug.keystore --ks-pass pass:android --key-pass pass:android "$f.aligned"
                        mv "$f.aligned" "$f"
                    done

            -   name: Upload to Releases
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ github.run_id }}
                    name: NPatch Build ${{ github.run_id }}
                    files: build/*-npatched.apk
                    generate_release_notes: true

            -   name: Delete old releases
                uses: Nats-ji/delete-old-releases@v1
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    keep-count: 1
                    keep-old-minor-releases: false
                    remove-tags: true
