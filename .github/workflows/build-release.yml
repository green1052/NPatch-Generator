name: Build and Release

on:
    schedule:
        -   cron: "0 0 */3 * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup pnpm
                uses: pnpm/action-setup@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: latest
                    cache: pnpm

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 25

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Cache camoufox browser
                uses: actions/cache@v6
                with:
                    path: ~/.cache/camoufox
                    key: camoufox

            -   name: Cache jars
                uses: actions/cache@v6
                with:
                    path: bin
                    key: jars-${{ hashFiles('package.json') }}

            -   name: Install camoufox browser
                run: npx camoufox-js fetch

            -   name: Install NordVPN
                shell: bash
                run: |
                    set -euo pipefail
                    
                    curl -fsSL \
                        https://downloads.nordcdn.com/apps/linux/install.sh \
                        -o /tmp/nordvpn-install.sh
                    
                    sh /tmp/nordvpn-install.sh
                    
                    sudo groupadd -f nordvpn
                    sudo usermod -aG nordvpn "$USER"
                    
                    sudo systemctl enable nordvpnd
                    sudo systemctl restart nordvpnd
                    
                    for i in {1..30}; do
                        if sudo systemctl is-active --quiet nordvpnd; then
                            break
                        fi
                        sleep 2
                    done
                    
                    sudo systemctl is-active --quiet nordvpnd

            -   name: Connect to NordVPN
                shell: bash
                env:
                    NORDVPN_TOKEN: ${{ secrets.NORDVPN_TOKEN }}
                run: |
                    set -euo pipefail
                    
                    nordvpn_cmd() {
                        sg nordvpn -c "$1"
                    }
                    
                    nordvpn_cmd "nordvpn --version"
                    
                    nordvpn_cmd \
                        "nordvpn login --token \"$NORDVPN_TOKEN\""
                    
                    nordvpn_cmd \
                        "nordvpn connect United_States"
                    
                    CONNECTED=false
                    
                    for i in {1..30}; do
                        STATUS=$(sg nordvpn -c 'nordvpn status' || true)
                    
                        echo "$STATUS"
                    
                        if printf '%s\n' "$STATUS" | grep -q "Connected"; then
                            CONNECTED=true
                            break
                        fi
                    
                        sleep 2
                    done
                    
                    if [ "$CONNECTED" != "true" ]; then
                        sg nordvpn -c 'nordvpn status' || true
                        sudo journalctl \
                            -u nordvpnd \
                            --no-pager \
                            -n 100 || true
                        exit 1
                    fi
                    
                    sg nordvpn -c 'nordvpn status'

            -   name: Build APKs
                env:
                    DISPLAY: :99
                run: |
                    set -euo pipefail
                    
                    Xvfb :99 \
                        -screen 0 1920x1080x24 \
                        > /tmp/xvfb.log 2>&1 &
                    
                    XVFB_PID=$!
                    
                    trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
                    
                    sleep 2
                    
                    if ! kill -0 "$XVFB_PID" 2>/dev/null; then
                        cat /tmp/xvfb.log || true
                        exit 1
                    fi
                    
                    pnpm start

            -   name: Disconnect NordVPN
                if: always()
                shell: bash
                run: |
                    set +e
                    sg nordvpn -c 'nordvpn disconnect'

            -   name: Upload to Releases
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ github.run_id }}
                    name: NPatch Build ${{ github.run_id }}
                    files: build/*-npatched.apk
                    generate_release_notes: true

            -   name: Delete old releases
                uses: Nats-ji/delete-old-releases@v1
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    keep-count: 1
                    keep-old-minor-releases: false
                    remove-tags: true
