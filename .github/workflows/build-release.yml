name: Build and Release

on:
    schedule:
        -   cron: "0 0 */3 * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   uses: actions/checkout@v7

            -   uses: pnpm/action-setup@v6

            -   uses: actions/setup-node@v7
                with:
                    node-version: latest
                    cache: pnpm

            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 25

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Cache patchright chromium
                uses: actions/cache@v6
                with:
                    path: ~/.cache/ms-playwright
                    key: patchright-chromium

            -   name: Cache jars
                uses: actions/cache@v6
                with:
                    path: bin
                    key: jars-${{ hashFiles('package.json') }}

            -   name: Install patchright browser
                run: pnpm exec patchright install chromium

            -   name: Connect NordVPN
                id: vpn
                uses: pau-vega/nordvpn-action@nordvpn-v1.0.0
                with:
                    region: US
                    username: ${{ secrets.NORDVPN_SERVICE_USERNAME }}
                    password: ${{ secrets.NORDVPN_SERVICE_PASSWORD }}

            -   name: Build APKs
                env:
                    DISPLAY: :99
                run: |
                    Xvfb :99 -screen 0 1920x1080x24 &
                    pnpm start

            -   name: Disconnect VPN
                if: always()
                uses: pau-vega/nordvpn-action/disconnect@nordvpn-v1.0.0

            -   name: Upload to Releases
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ github.run_id }}
                    name: NPatch Build ${{ github.run_id }}
                    files: build/*-npatched.apk
                    generate_release_notes: true

            -   name: Delete old releases
                uses: Nats-ji/delete-old-releases@v1
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    keep-count: 1
                    keep-old-minor-releases: false
                    remove-tags: true
